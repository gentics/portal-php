        identifier = "reference"
        name = "Reference project"
        title = "Reference project on github"
        url = "https://github.com/gentics/portal-php-reference"
        weight = -100
    [[menu.main]]
        identifier = "changelog"
        name = "Changelog"
        title = "Release versions changelog"
        url = "/changelog/"
        weight = -200

[params.docsBase]
    laravel = "https://laravel.com/docs/9.x"
    carbon  = "https://carbon.nesbot.com/docs"
    mesh    = "https://getmesh.io/docs"
    jira    = "https://jira.gentics.com/browse"
