languageCode = "en-us"
title = "Gentics Portal | php - Documentation"
baseurl = ""
theme = "gentics-hugo-theme"

DefaultContentLanguage = "en-us" # change to your language

relativeURLs = true
hasCJKLanguage = false # if your site has CJK language, set true
