query sitemap($lang: [String]){
    project {
        uuid
        rootNode {
            children(lang: $lang) {
                elements {
                    ...sitemapNavigation
                    children(lang: $lang) {
                        elements {
                            ...sitemapNavigation
                            children(lang: $lang) {
                                elements {
                                    ...sitemapNavigation
                                    children(lang: $lang) {
                                        elements {
                                            ...sitemapNavigation
                                            children(lang: $lang) {
                                                elements {
                                                    ...sitemapNavigation
                                                }
                                            }
                                        }
                                    }
                                }
                            }
                        }
                    }
                }
            }
        }
    }
}